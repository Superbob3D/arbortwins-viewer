<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArborTwins Point Cloud Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/potree@1.8.21/build/potree/potree.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a1a;
        }

        #viewer {
            width: 100%;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            max-width: 300px;
        }

        #info h2 {
            margin-bottom: 10px;
            font-size: 14px;
        }

        #info p {
            margin: 5px 0;
            line-height: 1.4;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
        }

        .progress-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 15px auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <div id="loading">
        <h2>Loading Point Cloud...</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p id="loadingStatus">Initializing...</p>
    </div>

    <div id="info">
        <h2>ArborTwins Viewer</h2>
        <p><strong>Project:</strong> HW_01</p>
        <p><strong>Controls:</strong></p>
        <p>• Mouse: Rotate & Pan</p>
        <p>• Scroll: Zoom</p>
        <p>• Right Click: Pan</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/potree@1.8.21/build/potree/potree.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        // Configuration
        const R2_BASE_URL = 'https://arbortwins-clouds.r2.cloudflarestorage.com/HW_01';
        const VIEWER_ELEMENT = document.getElementById('viewer');
        const LOADING_ELEMENT = document.getElementById('loading');
        const PROGRESS_FILL = document.getElementById('progressFill');
        const LOADING_STATUS = document.getElementById('loadingStatus');

        // Initialize viewer
        let viewer = new Potree.Viewer(VIEWER_ELEMENT);
        viewer.setEDLEnabled(false);
        viewer.setPointBudget(1_000_000);

        // Camera setup
        viewer.scene.getActiveCamera().position.set(0, 0, 100);
        viewer.scene.getActiveCamera().lookAt(0, 0, 0);

        // Load point cloud from R2
        function loadPointCloud() {
            LOADING_STATUS.textContent = 'Fetching metadata...';

            Potree.POCLoader.load(
                R2_BASE_URL + '/metadata.json',
                function(geometry, material) {
                    const pointcloud = new Potree.PointCloud('HW_01', geometry, material);
                    viewer.scene.addPointCloud(pointcloud);

                    // Auto-fit camera
                    const bbox = pointcloud.getBoundingBox();
                    const size = bbox.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = viewer.scene.getActiveCamera().fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 1.5; // Add margin

                    viewer.scene.getActiveCamera().position.z = cameraZ;
                    viewer.scene.getActiveCamera().lookAt(
                        bbox.getCenter(new THREE.Vector3())
                    );

                    // Hide loading UI
                    LOADING_ELEMENT.style.display = 'none';
                    LOADING_STATUS.textContent = 'Ready!';
                },
                function(event) {
                    // Progress callback
                    if (event.lengthComputable) {
                        const percentComplete = (event.loaded / event.total) * 100;
                        PROGRESS_FILL.style.width = percentComplete + '%';
                        LOADING_STATUS.textContent = `Loading: ${Math.round(percentComplete)}%`;
                    }
                },
                function(error) {
                    LOADING_STATUS.textContent = 'Error loading point cloud. Check R2 URL.';
                    console.error('Load error:', error);
                }
            );
        }

        // Start loading when page is ready
        window.addEventListener('load', loadPointCloud);
    </script>
</body>
</html>
